# Checks of the plugin itself on every pull request and on main: secret scan of the
# pull request's commits and of the whole history, then the script test suite.
name: checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the history scan and the pull request range need every commit
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22 # browser-session.js needs the global WebSocket
      - name: Secret scan of the pull request commits
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/secret-scan.sh . --range "$BASE..$HEAD"
      - name: Secret scan of the whole history
        run: bash scripts/secret-scan.sh . --history
      - name: Script tests
        run: bash tests/scripts.test.sh
