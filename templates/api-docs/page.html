<title>__SISKA_TITLE__</title>
<style>
/* Layout: slim branded bar (identity, base URL, exports) above the full-height reference. */
:root {
  --brand: __SISKA_BRAND__; --brand-dark: __SISKA_BRAND_DARK__;
  --bg: #ffffff; --fg: #17202b; --muted: #5b6776; --line: #e3e7ec; --soft: #f5f7f9;
  --accent: var(--brand); --on-accent: __SISKA_ON_BRAND__;
  --font: __SISKA_FONT__;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1419; --fg: #e6ebf1; --muted: #93a1b1; --line: #26313d; --soft: #161d25; --accent: var(--brand-dark); --on-accent: #0f1419; color-scheme: dark } }
:root[data-theme="dark"] { --bg: #0f1419; --fg: #e6ebf1; --muted: #93a1b1; --line: #26313d; --soft: #161d25; --accent: var(--brand-dark); --on-accent: #0f1419; color-scheme: dark }
* { box-sizing: border-box }
[hidden] { display: none !important }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.5 var(--font) }
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--bg); border-top: 3px solid var(--accent) }
.id { display: flex; align-items: center; gap: 10px; min-width: 0 }
.id img { height: 28px; width: auto; max-width: 140px; object-fit: contain }
.id h1 { font-size: 16px; margin: 0; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.pill { font-size: 12px; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap }
.base { font: 12.5px ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; color: var(--muted); overflow-wrap: anywhere; min-width: 0 }
.exports { margin-left: auto; display: flex; flex-wrap: wrap; align-items: center; gap: 6px }
.exports span { font-size: 12px; color: var(--muted) }
.exports button { font: inherit; font-size: 13px; padding: 5px 11px; border-radius: 6px; cursor: pointer; border: 1px solid var(--line); background: var(--soft); color: var(--fg) }
.exports button.main { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600 }
.exports button:hover { border-color: var(--accent) }
.exports button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.note { font-size: 12.5px; color: var(--muted); padding: 6px 16px; background: var(--soft); border-bottom: 1px solid var(--line) }
.toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 8px 14px; border-radius: 6px; font-size: 13px; z-index: 50 }
#copybox { position: fixed; inset: 10% 16px auto; max-width: 720px; margin: 0 auto; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 12px; z-index: 60; box-shadow: 0 12px 32px rgba(0,0,0,.2) }
#copybox textarea { width: 100%; height: 50vh; font: 12px ui-monospace, Menlo, monospace; background: var(--soft); color: var(--fg); border: 1px solid var(--line); border-radius: 6px }
#copybox button { margin-top: 8px }
#app:not(:empty):not(:has(*)) { padding: 24px 16px; color: var(--muted) }
@media (max-width: 640px) { .exports { margin-left: 0 } }
</style>

<header class="bar">
  <div class="id">__SISKA_LOGO__<h1 id="name"></h1><span class="pill" id="version"></span></div>
  <div class="base" id="base"></div>
  <div class="exports" role="group" aria-label="Export">
    <span>Export</span>
    <button class="main" data-file="collection">Postman collection</button>
    <button data-file="environment">Postman environment</button>
    <button data-file="openapi">OpenAPI</button>
  </div>
</header>
<p class="note" id="note">Insomnia, Bruno and Hoppscotch import the OpenAPI or the Postman file. Set the <code>token</code> variable in your own environment; it is never stored here.</p>
<div id="app"></div>
<div id="copybox" hidden role="dialog" aria-label="Copy the file"><textarea id="copytext" readonly></textarea><button id="copyclose">Close</button></div>

<script type="application/json" id="siska-docs">__SISKA_DATA__</script>
<script src="https://cdn.jsdelivr.net/npm/@scalar/api-reference@1.72.3/dist/browser/standalone.js"></script>
<script>
// API reference page. Data (spec, collection, environment, identity) is embedded as JSON text and inserted as text only.
(function () {
  var d = JSON.parse(document.getElementById("siska-docs").textContent);
  var $ = function (id) { return document.getElementById(id); };
  $("name").textContent = d.title; $("version").textContent = d.version ? "v" + d.version : "OpenAPI";
  $("base").textContent = d.baseUrl;
  // Shared pages cannot start downloads themselves: they use the viewer's "downloads" capability when it
  // is offered (the viewer confirms each file), and fall back to copying the file.
  var saver = null;
  if (d.shared) $("note").textContent = "Shared page: read the endpoints and their data here. Export gives you the Postman or OpenAPI file to import in Postman, Insomnia, Bruno or Hoppscotch. To send requests, open the project's docs page or import the collection.";
  function toast(msg) { var t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t); setTimeout(function () { t.remove(); }, 2400); }
  function fileOf(kind) {
    if (kind === "collection") return { name: d.slug + ".postman_collection.json", body: JSON.stringify(d.collection, null, 2) };
    if (kind === "environment") return { name: d.slug + ".postman_environment.json", body: JSON.stringify(d.environment, null, 2) };
    return { name: d.slug + ".openapi.json", body: JSON.stringify(d.spec, null, 2) };
  }
  function copyFile(f) {
    var p = navigator.clipboard && navigator.clipboard.writeText ? navigator.clipboard.writeText(f.body) : Promise.reject();
    p.then(function () { toast("Copied " + f.name + " – paste it into a file to import it"); }, function () {
      $("copytext").value = f.body; $("copybox").hidden = false; $("copytext").focus(); $("copytext").select();
    });
  }
  function exportFile(kind) {
    var f = fileOf(kind);
    if (!d.shared) {
      var a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([f.body], { type: "application/json" })); a.download = f.name;
      document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000); return;
    }
    if (!saver) { copyFile(f); return; }
    saver.save({ filename: f.name, data: f.body }).then(function () { toast("Saved " + f.name); }, function (e) {
      var code = e && e.code;
      if (code === "declined") return;
      if (code === "rate_limited") { toast("A save is already waiting for your answer"); return; }
      copyFile(f);
    });
  }
  var buttons = document.querySelectorAll(".exports button");
  function label(copy) { Array.prototype.forEach.call(buttons, function (b) { b.textContent = (copy ? "Copy " : "") + b.dataset.label; }); }
  Array.prototype.forEach.call(buttons, function (b) { b.dataset.label = b.textContent; b.addEventListener("click", function () { exportFile(b.dataset.file); }); });
  if (d.shared) {
    label(true);
    if (window.claude && typeof window.claude.use === "function") {
      window.claude.use("downloads").then(function (n) { if (n) { saver = n; label(false); } }, function () {});
    }
  }
  $("copyclose").addEventListener("click", function () { $("copybox").hidden = true; });
  // Reference, with the project's accent colour; no proxy: requests go straight from the browser to the API (CORS).
  var config = { servers: [{ url: d.baseUrl }], withDefaultFonts: false, hideDownloadButton: true, customCss: d.css };
  if (d.specUrl) config.url = d.specUrl; else config.content = d.spec;
  if (window.Scalar && typeof window.Scalar.createApiReference === "function") window.Scalar.createApiReference("#app", config);
  else $("app").textContent = "The interactive reference could not load (offline, or cdn.jsdelivr.net blocked). The exports above still work: import the collection or the OpenAPI file in your API client.";
})();
</script>
